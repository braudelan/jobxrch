<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — jobXrch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; font-size: 1rem; }
        body { display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; padding: 4rem 1rem 0; }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 0 0.5rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--pico-muted-border-color);
            flex-shrink: 0;
        }
        .top-bar-left { display: flex; align-items: center; gap: 0.75rem; position: relative; }
        .top-bar h2 { margin: 0; font-size: 1rem; font-weight: 700; }
        .top-bar nav { display: flex; gap: 1rem; font-size: 0.95rem; }
        .top-bar nav a { color: var(--pico-muted-color); text-decoration: none; }
        .top-bar nav a:hover { color: var(--pico-primary); }
        .theme-toggle { background: none; border: 1px solid var(--pico-muted-border-color); border-radius: 999px; cursor: pointer; font-size: 1rem; padding: 0.25rem 0.6rem; color: var(--pico-muted-color); line-height: 1; }
        .theme-toggle:hover { border-color: var(--pico-primary); color: var(--pico-primary); }

        .model-pill {
            display: inline-flex; align-items: center; gap: 0.65rem;
            font-size: 0.72rem; font-family: monospace;
            color: #fff;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s, color 0.15s;
        }
        .model-pill:hover { border-color: var(--pico-primary); color: #fff; }
        .model-pill .arrow { font-size: 0.6rem; opacity: 0.7; }

        .model-popover {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 100;
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            padding: 1rem;
            min-width: 280px;
        }
        .model-popover.open { display: block; }
        .popover-label { font-size: 0.72rem; color: var(--pico-muted-color); display: block; margin-bottom: 0.4rem; }
        .popover-label + .popover-label { margin-top: 0.75rem; }
        .popover-select { width: 100%; font-size: 0.8rem; margin: 0 0 0.1rem; padding: 0.3rem 0.5rem; }
        .popover-input { width: 100%; font-size: 0.8rem; font-family: monospace; margin: 0 0 0.1rem; padding: 0.3rem 0.5rem; }
        .popover-unavail { font-size: 0.7rem; color: orange; margin-top: 0.2rem; }
        .popover-save { margin-top: 0.75rem; padding: 0.3rem 0.9rem; font-size: 0.8rem; }
        .popover-status { font-size: 0.72rem; color: var(--pico-muted-color); margin-top: 0.4rem; min-height: 1em; }

        .messages {
            overflow-y: auto;
            max-height: 65vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 10px;
            background: var(--pico-card-background-color);
        }

        .msg { display: flex; gap: 0.5rem; max-width: 100%; }
        .msg.user { flex-direction: row-reverse; }

        .bubble {
            padding: 0.5rem 0.85rem;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            font-size: 1.1rem;
        }
        .msg.user .bubble {
            background: var(--pico-primary);
            color: #fff;
            border-bottom-right-radius: 3px;
        }
        .msg.assistant .bubble {
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-bottom-left-radius: 3px;
        }
        .msg.assistant .bubble h1,
        .msg.assistant .bubble h2,
        .msg.assistant .bubble h3 { font-size: 0.88rem; margin: 0.5rem 0 0.2rem; }
        .msg.assistant .bubble ul,
        .msg.assistant .bubble ol { padding-left: 1.2rem; margin: 0.2rem 0; }
        .msg.assistant .bubble p { margin: 0.3rem 0; }

        .bottom-bar {
            flex-shrink: 0;
            padding: 0.75rem 0;
            margin-top: 2.5rem;
            border-top: 1px solid var(--pico-muted-border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .input-row { display: flex; gap: 0.5rem; }
        .input-row textarea {
            flex: 1;
            resize: none;
            min-height: 4rem;
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            margin: 0;
            field-sizing: content;
            max-height: 16rem;
            overflow-y: auto;
            line-height: 1.5;
        }
        .input-row button {
            padding: 0.4rem 1rem;
            font-size: 1rem;
            margin: 0;
            align-self: flex-end;
        }
        .action-row { display: flex; justify-content: flex-end; gap: 0.5rem; align-items: center; }
        .distill-btn {
            background: none;
            border: 1px solid var(--pico-muted-border-color);
            color: var(--pico-muted-color);
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .distill-btn:hover { border-color: var(--pico-primary); color: var(--pico-primary); }
        .distill-msg { font-size: 0.75rem; color: var(--pico-muted-color); }

        .typing { font-size: 0.78rem; color: var(--pico-muted-color); padding: 0 0.5rem; }
    </style>
    <script>(function(){const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <h2>Chat</h2>
            <div id="model-pill-container">
                <button class="model-pill" id="model-pill" type="button">
                    <span id="pill-label">{{ current_provider }} · {{ current_model }}</span>
                    <span class="arrow">▾</span>
                </button>
                <div class="model-popover" id="model-popover">
                    <span class="popover-label">Provider</span>
                    <select class="popover-select" id="popover-provider">
                        {% for p in providers %}
                        <option value="{{ p }}" {% if p == current_provider %}selected{% endif %}>
                            {{ p }}{% if not available[p] %} (no key){% endif %}
                        </option>
                        {% endfor %}
                    </select>
                    <div id="popover-model-section">
                        <span class="popover-label" id="popover-model-label">Model</span>
                        <input class="popover-input" id="popover-model" type="text"
                               value="{{ current_model }}"
                               placeholder="{{ provider_default_models.get(current_provider, '') }}">
                    </div>
                    <button class="popover-save" id="popover-save" type="button">Apply</button>
                    <div class="popover-status" id="popover-status"></div>
                </div>
            </div>
        </div>
        <nav>
            <a href="/">list</a>
            <a href="/profile">profile</a>
            <a href="/settings">settings</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle">☀️</button>
    </div>

    <div class="messages" id="messages">
        {% for m in messages %}
        <div class="msg {{ m.role }}">
            <div class="bubble" {% if m.role == 'assistant' %}data-markdown="{{ m.content | e }}"{% endif %}>
                {% if m.role == 'assistant' %}{% else %}{{ m.content }}{% endif %}
            </div>
        </div>
        {% endfor %}
        {% if not messages %}
        <p style="color: var(--pico-muted-color); font-size: 0.8rem; text-align: center; margin-top: 2rem;">
            Ask me about your job search, discuss a specific role, or tell me more about what you're looking for.
        </p>
        {% endif %}
    </div>

    <div class="bottom-bar">
        <div class="input-row">
            <textarea id="input" placeholder="Message…" rows="1"></textarea>
            <button id="send-btn">Send</button>
        </div>
        <div class="action-row">
            <span class="distill-msg" id="distill-msg"></span>
            <button class="distill-btn" id="distill-btn">Save insights to profile</button>
        </div>
    </div>

    <script>
    // Render existing assistant markdown bubbles
    document.querySelectorAll('.bubble[data-markdown]').forEach(el => {
        el.innerHTML = marked.parse(el.dataset.markdown);
    });

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const distillBtn = document.getElementById('distill-btn');
    const distillMsg = document.getElementById('distill-msg');

    // In-memory conversation history (loaded from rendered messages)
    const history = [];
    document.querySelectorAll('#messages .msg').forEach(el => {
        const role = el.classList.contains('user') ? 'user' : 'assistant';
        const bubble = el.querySelector('.bubble');
        const content = bubble.dataset.markdown ?? bubble.textContent.trim();
        if (content) history.push({ role, content });
    });

    function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    scrollBottom();

    function appendMsg(role, content) {
        // Remove empty-state placeholder if present
        const placeholder = messagesEl.querySelector('p');
        if (placeholder) placeholder.remove();

        const div = document.createElement('div');
        div.className = `msg ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'assistant') {
            bubble.innerHTML = marked.parse(content);
        } else {
            bubble.textContent = content;
        }
        div.appendChild(bubble);
        messagesEl.appendChild(div);
        scrollBottom();
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';
        inputEl.style.height = 'auto';

        appendMsg('user', text);
        history.push({ role: 'user', content: text });

        // Typing indicator
        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.textContent = '…';
        messagesEl.appendChild(typing);
        scrollBottom();

        sendBtn.disabled = true;
        try {
            const res = await fetch('/chat/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: history }),
            });
            const data = await res.json();
            typing.remove();
            appendMsg('assistant', data.reply);
            history.push({ role: 'assistant', content: data.reply });
        } catch (e) {
            typing.remove();
            appendMsg('assistant', 'Error — please try again.');
        } finally {
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    // Auto-resize fallback for browsers without field-sizing: content
    function autoResize() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 256) + 'px';
    }
    inputEl.addEventListener('input', autoResize);

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    distillBtn.addEventListener('click', async () => {
        distillBtn.disabled = true;
        distillMsg.textContent = 'Saving…';
        try {
            const res = await fetch('/chat/distill', { method: 'POST' });
            const data = await res.json();
            distillMsg.textContent = 'Profile updated ✓';
            setTimeout(() => { distillMsg.textContent = ''; }, 3000);
        } catch (e) {
            distillMsg.textContent = 'Failed — try again.';
        } finally {
            distillBtn.disabled = false;
        }
    });

    // Theme toggle
    (function() {
        const btn = document.getElementById('theme-toggle');
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; localStorage.setItem('theme', t); }
        applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
        btn.addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    })();

    // Model picker popover
    (function() {
        const defaultModels = {{ provider_default_models | tojson }};
        const currentModels = {{ current_models | tojson }};

        const pill = document.getElementById('model-pill');
        const pillLabel = document.getElementById('pill-label');
        const popover = document.getElementById('model-popover');
        const providerSelect = document.getElementById('popover-provider');
        const modelInput = document.getElementById('popover-model');
        const modelSection = document.getElementById('popover-model-section');
        const modelLabel = document.getElementById('popover-model-label');
        const saveBtn = document.getElementById('popover-save');
        const status = document.getElementById('popover-status');

        function updateModelField(provider) {
            const hasModel = provider in defaultModels;
            modelSection.style.display = hasModel ? '' : 'none';
            if (hasModel) {
                modelInput.value = currentModels[provider] || defaultModels[provider] || '';
                modelInput.placeholder = defaultModels[provider] || '';
                modelLabel.textContent = 'Model';
            }
        }

        pill.addEventListener('click', e => {
            e.stopPropagation();
            popover.classList.toggle('open');
            if (popover.classList.contains('open')) {
                updateModelField(providerSelect.value);
                status.textContent = '';
            }
        });

        providerSelect.addEventListener('change', () => updateModelField(providerSelect.value));

        document.addEventListener('click', e => {
            if (!document.getElementById('model-pill-container').contains(e.target)) {
                popover.classList.remove('open');
            }
        });

        saveBtn.addEventListener('click', async () => {
            const provider = providerSelect.value;
            const payload = { provider };
            Object.keys(defaultModels).forEach(p => {
                payload[`${p}_model`] = p === provider ? modelInput.value.trim() : (currentModels[p] || defaultModels[p]);
            });

            saveBtn.disabled = true;
            status.textContent = 'Saving…';
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error(await res.text());
                currentModels[provider] = payload[`${provider}_model`];
                const model = currentModels[provider] || defaultModels[provider] || '';
                pillLabel.textContent = `${provider} · ${model}`;
                status.textContent = 'Saved ✓';
                setTimeout(() => { popover.classList.remove('open'); status.textContent = ''; }, 900);
            } catch (e) {
                status.textContent = 'Failed — try again.';
            } finally {
                saveBtn.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
